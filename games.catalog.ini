; FlatToDepth games catalog: the games that can be shown in stereoscopic 3D in VR, and what it takes to set each one up.
; The in-headset menu and the install scripts both read this file. Do not edit it: updates replace it. To add your own
; games, or to change one of these, put the section in games.user.ini instead (see docs\GAMES.md). A section in
; games.user.ini with the same name as one here replaces it.
;
; Every entry is a game that a Geo-11 stereo fix exists for. The fixes are other people's work and are never part of
; FlatToDepth: fix_url is where the installer downloads one from, and fix_sha256 pins exactly the file that was inspected, so
; nothing else is ever installed. Lines starting with ; are comments.
;
;   [id]                lower-case letters, digits, - and _; also the --game value
;   title, subtitle     shown in the in-headset menu
;   steam_app_id        the game's Steam app number (the number in its store page address)
;   exe                 the game's executable, no folder
;   folder              the game's usual folder name under steamapps\common, used only if Steam has no record of it
;   machine             x86 or x64: the executable's bitness, which picks the controller shim
;   profile             this game's own settings file; default flattodepth-<id>.ini
;   key1 ... key6       stereo-fix shortcuts for the tools panel, as  Label|F1  (F1 to F12)
;   shim_files          the controller shim DLL names to install in the game folder
;   shim_manifest       install record for the shim; default gamepad-install-<id>.json
;   fix_url, fix_archive, fix_sha256, fix_author, fix_dir, fix_manifest, fix_inner, fix_marker
;                       how to install the stereo fix; leave all out to bring your own

[blindforest]
title=Ori and the Blind Forest
subtitle=Definitive Edition
steam_app_id=387290
exe=oriDE.exe
folder=Ori DE
machine=x86
key1=Convergence|F1
key2=HUD depth|F2
key3=HUD|F3
key4=Vignette|F4
key5=Bloom|F5
shim_files=xinput9_1_0.dll
shim_manifest=gamepad-install.json
fix_url=https://s3.amazonaws.com/masterotaku/Ori+and+the+Blind+Forest/Ori_DE_geo11_fix.7z
fix_archive=Ori_DE_geo11_fix.7z
fix_sha256=05AC228130069D497CCF6FA5F529F74D8C55D1D5377407E5CBCEAA09E2D7F1EC
fix_author=Alejandro Rodriguez Solis (HelixMod)
fix_dir=ori-fix
fix_manifest=geo11-install.json
fix_inner=FixFiles.7z
fix_marker=d3dx.ini

[wotw]
title=Ori and the Will of the Wisps
steam_app_id=1057090
exe=oriwotw.exe
folder=Ori and the Will of the Wisps
machine=x64
key1=Convergence|F1
key2=HUD depth|F2
key3=HUD|F3
key4=Blurriness|F4
key5=Vignette|F5
key6=Bloom|F6
; The engine loads XInput1_4 and falls back to older names, so the same shim goes in under two names.
shim_files=xinput1_4.dll,xinput1_3.dll
shim_manifest=gamepad-install-wotw.json
fix_url=https://s3.amazonaws.com/masterotaku/Ori+and+the+Will+of+the+Wisps/Ori_and_the_Will_of_the_Wisps_geo11_fix.7z
fix_archive=Ori_and_the_Will_of_the_Wisps_geo11_fix.7z
fix_sha256=BA31AAD3CF9828F95CC5B7B1522DF60D51B5C86184B577D7B0691754B819EEC4
fix_author=Alejandro Rodriguez Solis (HelixMod)
fix_dir=wotw-fix
fix_manifest=geo11-install-wotw.json
fix_inner=FixFiles.7z
fix_marker=d3dx.ini
