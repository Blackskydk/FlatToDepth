[hollow-knight]
title=Hollow Knight
steam_app_id=367520
exe=hollow_knight.exe
folder=Hollow Knight
machine=x64
; The fix also has a HUD toggle on the 1 key, which the panel cannot press (it sends F1 to F12 only).
key1=Convergence|F1
key2=Depth of field|F2
key3=HUD depth|F3
key4=Film grain|F4
key5=Bloom|F5
; The game is now built with Unity 6, which reads controllers through Windows.Gaming.Input and not XInput, so a controller shim cannot reach it:
; the VR controllers reach it as a virtual Xbox controller in Windows instead (needs the ViGEmBus driver; see docs\GAMES.md).
gamepad=virtual
fix_url=https://s3.amazonaws.com/masterotaku/Hollow+Knight/Hollow_Knight_geo11_fix.7z
fix_archive=Hollow_Knight_geo11_fix.7z
fix_sha256=7ADF0E49C328D46118A3415300CA93C67AA473C63D2ECACCE76987CB8704C3DF
fix_author=Alejandro Rodriguez Solis (HelixMod)
fix_dir=hollow-knight-fix
fix_manifest=geo11-install-hollow-knight.json
fix_inner=FixFiles.7z
fix_marker=d3dx.ini
; The d3d11.dll inside that fix is an older Geo-11 build and, with the current game (Unity 6), the game stops at startup
; ("entry point not found": D3D11On12CreateDevice). The same files from the current Geo-11 driver work, so they replace it.
