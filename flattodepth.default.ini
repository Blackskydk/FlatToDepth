; FlatToDepth settings. FlatToDepth copies this file to flattodepth-<game>.ini the first time a game is shown (and to
; flattodepth.ini for the game menu), then keeps saving your window size and placement into that copy, so your
; changes survive updates. Delete a copy to go back to these defaults. Restart FlatToDepth after editing.
[screen]
distance_m=2.5
; Width of the visible picture, in metres.
picture_width_m=6.0
vertical_offset_m=0.0
; The Geo-11 export order was reversed on the machine FlatToDepth was developed on, so this starts at 1. If depth looks
; inside-out (distant things pop out), set this to 0 or press Swap eyes in the tools panel (both grips + B).
swap_eyes=1
; Only the centred part of the game picture with this width:height is shown, so the black bars a 16:9 game
; leaves on an ultrawide desktop are cut off. Set it to the game's own shape if it is not 16:9; 0 shows the whole export.
crop_aspect=1.777778
; Curved screen: 0 is flat, 1 wraps right round you. A runtime with curved layers draws it; otherwise (SteamVR) FlatToDepth draws it itself. The tools
; panel (both grips + B) cycles Off / Low / Medium / High and saves the value here.
curvature=0
; Only for runtimes with curved layers of their own: if a curved screen shows up at the wrong distance, the runtime reads the layer's position the other way round:
; set this to 1.
curve_pose_at_axis=0
; Ambient glow: a soft wash of the picture's own colours around the screen instead of a black room. glow_strength is 0 to 1.
glow=1
glow_strength=0.55
; Floating window: the fraction of the picture each eye hides at one edge (0 to 0.05), so the screen's edges look nearer
; than the picture and things that pop out of the screen are not cut off by it. 0 is off; the tools panel offers steps.
float_window=0
; Separation/convergence/HUD are controlled by Geo-11's d3dxdm.ini and the in-game F-keys (the tools panel presses them).
; Point a controller just under the window: a bar and a resize handle appear there.
; Trigger/grip on the bar: move (thumbstick push/pull = further/closer). On the handle: resize.
; Both grips + A: recenter. Geometry is saved whenever you let go.
[ui]
; 1 hides the bar and handle unless a controller points at them, 0 keeps them visible.
auto_hide=1
; Thumbstick push/pull speed while holding the bar (exponential; 0.1 to 5).
push_pull_rate=1.1
[steamvr]
; 1: while FlatToDepth runs, SteamVR does not open a flat game's own window in front of FlatToDepth when the game starts (its "game theater").
; FlatToDepth turns that SteamVR setting off and puts it back when it ends. 0 leaves SteamVR alone. Only the main flattodepth.ini is read for this.
hide_game_theater=1
[haptics]
; The game's rumble played on the controllers.
enabled=1
; 0 to 2: how strong it is.
strength=1.0
; 0: both controllers follow the stronger motor. 1: the left motor drives the left controller and the right one the right.
split=0
