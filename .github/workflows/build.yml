name: build

# Every push and pull request is built and tested. Pushing a tag like v0.1.0 also publishes a GitHub Release
# with the ready-to-install zip.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the OpenXR loader
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -NoCmake

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "FLATTODEPTH_VS_INSTALL=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Visual Studio: $vs"

      - name: Build the app and tests (x64)
        shell: cmd
        run: call scripts\build.cmd

      - name: Build the controller shim (x86, 32-bit games)
        shell: cmd
        run: call scripts\build-gamepad.cmd

      - name: Build the controller shim (x64, 64-bit games)
        shell: cmd
        run: call scripts\build-gamepad64.cmd

      # gpu_share_split needs a real GPU, which hosted runners do not have.
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -E gpu_share_split

      - name: Test the install scripts (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/scripts_test.ps1

      - name: Test the games catalog reader (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/catalog_test.ps1

      # The scripts must parse in Windows PowerShell 5.1, the version every Windows PC has.
      - name: Check the scripts parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $bad++; "$($_.Name): $(($errors | ForEach-Object Message) -join '; ')" } else { "ok  $($_.Name)" }
          }
          if ($bad) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev-${{ github.run_number }}' }
          ./scripts/package.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        with:
          name: FlatToDepth-win64
          path: dist/*.zip*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FlatToDepth-win64
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.zip.sha256 \
            --repo "${{ github.repository }}" \
            --title "FlatToDepth ${{ github.ref_name }}" \
            --generate-notes \
            --notes "**Install:** download the zip below, extract it, double-click **Install.cmd**, then **Start-FlatToDepth.cmd**. Full guide: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md). Requires Windows 10/11, Steam, SteamVR and a supported headset; tested on a Steam Frame."
